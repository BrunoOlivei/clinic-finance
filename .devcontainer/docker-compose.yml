services:
  app:
    build:
      context: ..
      dockerfile: .devcontainer/Dockerfile
    volumes:
      - ..:/workspace:cached
    command: sleep infinity
    environment:
      # Sobrescreve o POSTGRES_DSN do .env (que aponta para localhost, usado
      # ao rodar fora do container) — dentro do compose o Postgres é
      # alcançado pelo nome do serviço.
      POSTGRES_DSN: postgresql://clinic:clinic@db:5432/clinic_finance
    depends_on:
      - db

  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: clinic
      POSTGRES_PASSWORD: clinic
      POSTGRES_DB: clinic_finance
    volumes:
      - postgres-data:/var/lib/postgresql/data
    ports:
      - "5432:5432"

volumes:
  postgres-data:
