version: 2

models:
  - name: stg_production_reports
    description: "Relatório de produção médica"
    columns:
      - name: tp_service
        description: "Tipo de serviço"
      - name: nm_branch
        description: "Nome do plano de atendimento"
      - name: dt_execution
        description: "Data de execução do procedimento"
        tests:
          - not_null
      - name: cd_patient
        description: "Código do paciente"
        tests:
          - not_null
      - name: nm_patient
        description: "Nome do paciente"
        tests:
          - not_null
      - name: cd_doctor
        description: "Número de registro CRM do médico"
        tests:
          - not_null
