        description: "Sigla de unidade federativa do registro no CRM do médico"
        tests:
          - not_null
      - name: nm_doctor
        description: "Nome do médico"
        tests:
          - not_null
      - name: cd_procedure
        description: "Código do procedimento"
        tests:
          - not_null
      - name: nm_procedure
        description: "Nome do procedimento"
        tests:
          - not_null
      - name: is_urgent
