        description: "Código de senha de execução do procedimento ou consulta"
        tests:
          - not_null
      - name: dt_period
        description: "Período de execução do procedimento"
        tests:
          - not_null
      - name: created_at
        description: "Data de criação do registro"
        tests:
          - not_null
      - name: updated_at
        description: "Data de atualização do registro"
        tests:
          - not_null
  
